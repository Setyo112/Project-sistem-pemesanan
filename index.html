<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content=("width=device-width), initial-scale=1.0">
    <title>Form Pemesanan - UI Hitam Biru</title>
    <style>
  /* Reset & Base Style */
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background-color: #0d1117;
        color: #c9d1d9;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
      }

      /* Container Form */
      .form-container {
        background-color: #161b22;
        border: 1px solid #30363d;
        border-radius: 12px;
        padding: 32px;
        width: 100%;
        max-width: 480px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      }

      .form-header {
        margin-bottom: 24px;
        text-align: center;
      }

      .form-header h2 {
        color: #58a6ff;
        font-size: 1.6rem;
        margin-bottom: 8px;
      }

      .form-header p {
        color: #8b949e;
        font-size: 0.9rem;
      }

      /* Group Input */
      .form-group {
        margin-bottom: 20px;
      }

      .form-group label {
        display: block;
        margin-bottom: 8px;
        font-size: 0.9rem;
        font-weight: 600;
        color: #c9d1d9;
      }

      .form-group input,
      .form-group select,
      .form-group textarea {
        width: 100%;
        padding: 12px;
        background-color: #0d1117;
        border: 1px solid #30363d;
        border-radius: 6px;
        color: #c9d1d9;
        font-size: 0.95rem;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      .form-group input:focus,
      .form-group select:focus,
      .form-group textarea:focus {
        border-color: #1f6feb;
        box-shadow: 0 0 0 3px rgba(31, 111, 235, 0.3);
      }

      /* Tombol */
      .btn-submit {
        width: 100%;
        padding: 12px;
        background: linear-gradient(135deg, #1f6feb 0%, #1158c7 100%);
        color: #ffffff;
        border: none;
        border-radius: 6px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s;
      }

      .btn-submit:hover {
        opacity: 0.9;
      }

      /* Responsive adjustment */
      @media (max-width: 480px) {
        .form-container {
          padding: 20px;
        }
      }
    </style>
  </head>
  <body>

    <div class="form-container">
      <div class="form-header">
        <h2>Form Pemesanan</h2>
        <p>Lengkapi formulir di bawah ini untuk melakukan pemesanan</p>
      </div>

      <form action="#" method="POST">
        <div class="form-group">
          <label for="nama">Nama Lengkap</label>
          <input type="text" id="nama" name="nama" placeholder="Masukkan nama Anda" required>
        </div>

        <div class="form-group">
          <label for="email">Alamat Email</label>
          <input type="email" id="email" name="email" placeholder="contoh@email.com" required>
        </div>

        <div class="form-group">
          <label for="produk">Pilih Produk</label>
          <select id="produk" name="produk" required>
            <option value="" disabled selected>-- Pilih Paket --</option>
            <option value="basic">Paket Basic (Hitam Biru)</option>
            <option value="pro">Paket Pro (Hitam Biru)</option>
            <option value="enterprise">Paket Enterprise</option>
          </select>
        </div>

        <div class="form-group">
          <label for="catatan">Catatan Tambahan</label>
          <textarea id="catatan" name="catatan" rows="4" placeholder="Tuliskan detail pesanan Anda..."></textarea>
        </div>

        <button type="submit" class="btn-submit">Kirim Pemesanan</button>
      </form>
    </div>

  </body>
</html>
