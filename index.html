<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pemesanan</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>

  <div class="form-container">
    <div class="form-header">
      <h2>Form Pemensanan</h2>
      <p>Lengkapi formulir di bawah ini untuk melakukan pemesanan</p>
    </div>

    <!--Alert Notifikasi Sukses -->
    <div id="alertSucces" class="alert-succes">
    </div>

    <form id="orderForm" action="#" method="POST" novalidate>
      <div class="form-group" id="groupNama">
        <label for="nama">Nama Panggilan</label>
        <input type="text" id="nama" name="nama placeholder="Masukkan nama Anda" required>
        <small class="errormessage">Nama panggilan wajib diisi.</small>
      </div>

      <div class="form-group" id="groupEmail">
        <label for="email">Alamat Email</label>
        <input type="email" id="email" name="email" placeholder="conto@gmail.com" required>
        <small class="error-message">Masukan alamt email yang valid.</small>
      </div>

      <div class="form-group" id="groupProduk">
        <label for="produk">Pilih Produk</label>
        <select id="produk" name="produk" required>
          <option value="" disabled selected>-- Pilih Paket --</option>
          <option value="basic">Paket Basic</option>
          <option value="pro">Paket Pro</option>
          <option value="enterprise">Paket Exclusive</option>
        </select>
        <small clas="error-message">Silahkan pilih salah satu paket produk.</small>
      </div>

      <div class="form-group">
        <label for="catatan">Catatan Tambahan</label>
        <textarea id="catatan" name="catatan" rows="4" placeholder="Tuliskan detail pesanan anda..."></textarea>
      </div>

      <button type="submit" id="btnSubmit" class="btn-submit">Kirim Pemesanan</button>
    </form>
  </div>

    <script src="script.js"></script>
  </body>
</html>
